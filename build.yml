name: Compilar instaladores de Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar instalador (Windows 32 y 64 bits)
        run: npm run dist

      - name: Guardar instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/*.exe

      - name: Publicar en Releases (solo cuando subes una etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
